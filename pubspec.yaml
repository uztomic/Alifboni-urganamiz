name: alifbo
description: "Alifboni o'rganamiz — o'zbek (lotin, yangi lotin, kirill), rus va ingliz alifbolarini tabiiy ovoz bilan o'rgatuvchi bolalar ilovasi."
publish_to: 'none'

# 2.0.0 — to'liq qayta qurilgan versiya. Build raqami Play Console'dagi
# oxirgi versionCode'dan katta bo'lishi shart.
version: 2.0.0+20

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Holat boshqaruvi
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5

  # Mahalliy saqlash (sozlamalar va natijalar)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Ovoz: ilova ichidagi tabiiy ovoz yozuvlari (webm/opus, mp3)
  just_audio: ^0.10.4
  # Zaxira: rus va ingliz tillari uchun telefonning TTS'i
  flutter_tts: ^4.2.0

  # Ziko maskoti (SVG)
  flutter_svg: ^2.2.0

  # Reklama (faqat banner + kamdan-kam interstitial)
  google_mobile_ads: ^9.0.0

  # Play Market'da baho/izoh so'rash (ota-ona tekshiruvidan keyin)
  in_app_review: ^2.0.10

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFF6E9"
  adaptive_icon_foreground: "assets/logo/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/ziko/
    - assets/images/icons/
    - assets/pictures/
    - assets/voice/uz/
    - assets/voice/en/
    - assets/voice/ru/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/tales/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    # Andika — savod o'rgatish uchun maxsus ishlangan shrift: "a", "g", "I/l"
    # harflari bolalar daftardagidek ko'rinadi. Harflar shu shriftda chiziladi.
    - family: Andika
      fonts:
        - asset: assets/fonts/Andika-Regular.ttf
        - asset: assets/fonts/Andika-Bold.ttf
          weight: 700
