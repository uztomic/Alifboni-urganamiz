# Capped well below this machine's 7GB total physical RAM (was -Xmx8G,
# which exceeds total RAM outright and reliably OOM-crashed the Gradle
# daemon/JVM during release builds - dex/R8 minification and the Dart
# AOT snapshotter run as separate processes needing their own memory
# alongside this heap, so leaving headroom matters).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
