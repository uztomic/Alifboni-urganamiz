name: CI

# Har push'da: kod tahlili (flutter analyze) va debug APK yig'ish.
# Natija "ci-report" branch'iga report.txt bo'lib yoziladi, APK esa
# Actions sahifasida "artifact" sifatida yuklab olinadi.
on:
  push:
    branches: [v2-qayta-qurish, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: |
          set +e
          { echo "commit: ${GITHUB_SHA}"; flutter --version; echo "=== PUB GET ==="; } > ci_report.txt 2>&1
          flutter pub get >> ci_report.txt 2>&1; echo "pub get exit: $?" >> ci_report.txt

      - name: Analyze
        run: |
          set +e
          echo "=== ANALYZE ===" >> ci_report.txt
          flutter analyze --no-fatal-infos --no-fatal-warnings >> ci_report.txt 2>&1; echo "analyze exit: $?" >> ci_report.txt

      - name: Test
        run: |
          set +e
          echo "=== TEST ===" >> ci_report.txt
          if [ -d test ]; then flutter test >> ci_report.txt 2>&1; echo "test exit: $?" >> ci_report.txt; else echo "no tests" >> ci_report.txt; fi

      - name: Build APK
        run: |
          set +e
          echo "=== BUILD ===" >> ci_report.txt
          flutter build apk --debug --android-skip-build-dependency-validation > build.log 2>&1; code=$?
          if [ $code -ne 0 ]; then
            echo "1-urinish muvaffaqiyatsiz, qayta urinilmoqda..." >> ci_report.txt
            sleep 20
            flutter build apk --debug --android-skip-build-dependency-validation > build.log 2>&1; code=$?
          fi
          echo "build exit: $code" >> ci_report.txt
          grep -E "error|Error|ERROR|FAILURE|What went wrong" -A3 build.log | head -150 >> ci_report.txt || true
          tail -40 build.log >> ci_report.txt
          ls -la build/app/outputs/flutter-apk/ >> ci_report.txt 2>&1 || true

      - name: Build release APK (telefonda sinash uchun)
        run: |
          set +e
          echo "=== RELEASE APK ===" >> ci_report.txt
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation > rel.log 2>&1
          echo "release exit: $?" >> ci_report.txt
          ls -la build/app/outputs/flutter-apk/ >> ci_report.txt 2>&1
          mkdir -p /tmp/apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/apk/Alifbo-2.0-arm64.apk 2>/dev/null
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk /tmp/apk/Alifbo-2.0-armv7.apk 2>/dev/null

      - name: Build web preview
        run: |
          set +e
          echo "=== WEB ===" >> ci_report.txt
          flutter build web --release --no-tree-shake-icons > web.log 2>&1; echo "web exit: $?" >> ci_report.txt
          tail -30 web.log >> ci_report.txt

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alifbo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

      - name: Publish report
        if: always()
        run: |
          cp ci_report.txt /tmp/report.txt
          rm -rf /tmp/web && cp -r build/web /tmp/web 2>/dev/null || true
          git config user.name "alifbo-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-report-tmp
          git rm -rf . -q || true
          cp /tmp/report.txt report.txt
          git add report.txt
          git commit -q -m "CI report ${GITHUB_SHA}"
          git push -f origin HEAD:ci-report
          if ls /tmp/apk/*.apk >/dev/null 2>&1; then
            git checkout -q --orphan apk-tmp
            git rm -rf . -q || true
            git clean -fdq
            cp /tmp/apk/*.apk .
            git add *.apk
            git commit -q -m "APK ${GITHUB_SHA}"
            git push -f origin HEAD:apk
          fi
          if [ -d /tmp/web ]; then
            git checkout -q --orphan web-preview-tmp
            git rm -rf . -q || true
            cp -r /tmp/web/. .
            git add -A
            git commit -q -m "Web preview ${GITHUB_SHA}"
            git push -f origin HEAD:web-preview
          fi
